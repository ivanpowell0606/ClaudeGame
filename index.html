<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tower Defense</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
    }
    #app {
      display: flex;
      justify-content: center;
      align-items: stretch;
      height: 100%;
    }
    #game-container {
      flex: 1;
      position: relative;
      height: 100%;
      background: #1a1a1a;
      box-sizing: border-box;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #ui-panel {
      /* visibility (not display) so its 200px stays reserved even while
         hidden on the menu — otherwise game-container briefly renders at
         full width, then jumps down to the sidebar-adjusted width once
         GameScene reveals it, causing a visible resize flash. */
      visibility: hidden;
      width: 200px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      padding: 16px;
      font-family: sans-serif;
      color: #ccc;
      box-sizing: border-box;
    }
    #ui-panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    .tower-button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #2c2f36;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ddd;
      font-size: 14px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .tower-button:hover {
      background: #383c45;
    }
    .tower-button:active {
      cursor: grabbing;
    }
    #hp-display {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #301f1f;
      border: 1px solid #5a3838;
      border-radius: 4px;
      color: #e0a09b;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }
    #cash-display {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #23301f;
      border: 1px solid #3f5a38;
      border-radius: 4px;
      color: #a9e08f;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }
    #start-wave-button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      background: #2f6b3a;
      border: 1px solid #3f8a4d;
      border-radius: 4px;
      color: #eafbea;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #start-wave-button:hover:not(:disabled) {
      background: #37803f;
    }
    #start-wave-button:disabled {
      background: #2c2f36;
      border-color: #444;
      color: #777;
      cursor: not-allowed;
    }

    #upgrade-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #upgrade-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    #upgrade-panel {
      position: fixed;
      top: 0;
      height: 100%;
      width: 25vw;
      background: #1a1a1a;
      box-sizing: border-box;
      padding: 24px;
      font-family: sans-serif;
      color: #ccc;
      z-index: 1001;
      transition: transform 0.25s ease;
      transform: translateX(-100%);
      pointer-events: none;
    }
    #upgrade-panel.side-left {
      left: 0;
      border-right: 1px solid #333;
      transform: translateX(-100%);
    }
    #upgrade-panel.side-right {
      right: 0;
      border-left: 1px solid #333;
      transform: translateX(100%);
    }
    #upgrade-panel.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    #upgrade-panel h2 {
      margin: 0 0 4px;
      font-size: 20px;
      color: #eee;
    }
    #upgrade-panel .upgrade-subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: #888;
    }
    #upgrade-close-button {
      position: absolute;
      top: 20px;
      right: 24px;
      background: #2c2f36;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ddd;
      font-size: 14px;
      padding: 6px 12px;
      cursor: pointer;
    }
    #upgrade-panel.side-left #upgrade-close-button {
      right: 24px;
      left: auto;
    }
    #upgrade-close-button:hover {
      background: #383c45;
    }
    #upgrade-empty-state {
      color: #777;
      font-size: 14px;
    }

    #result-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #result-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    #result-panel {
      width: 360px;
      max-width: 90vw;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 32px;
      font-family: sans-serif;
      color: #ccc;
      text-align: center;
      box-sizing: border-box;
    }
    #result-panel.victory {
      border-color: #3f8a4d;
    }
    #result-panel.defeat {
      border-color: #8a3f3f;
    }
    #result-title {
      margin: 0 0 12px;
      font-size: 28px;
      color: #eee;
    }
    #result-panel.victory #result-title {
      color: #a9e08f;
    }
    #result-panel.defeat #result-title {
      color: #e0a09b;
    }
    #result-message {
      margin: 0 0 24px;
      font-size: 14px;
      color: #999;
    }
    #result-panel button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #2c2f36;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #result-panel button:last-child {
      margin-bottom: 0;
    }
    #result-panel button:hover {
      background: #383c45;
    }
    #result-replay-button {
      background: #2f6b3a !important;
      border-color: #3f8a4d !important;
      color: #eafbea !important;
    }
    #result-replay-button:hover {
      background: #37803f !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game-container"></div>
    <div id="ui-panel">
      <div id="hp-display"></div>
      <div id="cash-display"></div>
      <button id="start-wave-button">Start Wave 1</button>
      <h2>Towers</h2>
      <button id="turret-button" class="tower-button">Turret</button>
    </div>
  </div>

  <div id="upgrade-backdrop"></div>
  <div id="upgrade-panel">
    <button id="upgrade-close-button">Close</button>
    <h2>Turret Upgrades</h2>
    <p class="upgrade-subtitle" id="upgrade-subtitle"></p>
    <p id="upgrade-empty-state">No upgrades available yet.</p>
  </div>

  <div id="result-backdrop">
    <div id="result-panel">
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <button id="result-replay-button">Replay Area</button>
      <button id="result-menu-button">Area Select</button>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
