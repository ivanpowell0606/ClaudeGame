<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tower Defense</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
    }
    #app {
      display: flex;
      justify-content: center;
      align-items: stretch;
      height: 100%;
    }
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: #1a1a1a;
      box-sizing: border-box;
    }
    canvas {
      display: block;
    }
    #ui-panel {
      width: 200px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      padding: 16px;
      font-family: sans-serif;
      color: #ccc;
      box-sizing: border-box;
    }
    #ui-panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    .tower-button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #2c2f36;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ddd;
      font-size: 14px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .tower-button:hover {
      background: #383c45;
    }
    .tower-button:active {
      cursor: grabbing;
    }
    #start-wave-button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      background: #2f6b3a;
      border: 1px solid #3f8a4d;
      border-radius: 4px;
      color: #eafbea;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #start-wave-button:hover:not(:disabled) {
      background: #37803f;
    }
    #start-wave-button:disabled {
      background: #2c2f36;
      border-color: #444;
      color: #777;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game-container"></div>
    <div id="ui-panel">
      <button id="start-wave-button">Start Wave 1</button>
      <h2>Towers</h2>
      <button id="turret-button" class="tower-button">Turret</button>
    </div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
